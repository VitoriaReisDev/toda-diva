<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Toda Diva</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo">Toda diva</div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabEntrar" onclick="trocarModo('entrar')">Entrar</button>
      <button class="auth-tab" id="tabCriar" onclick="trocarModo('criar')">Criar conta</button>
    </div>

    <form id="formAuth" onsubmit="enviarFormulario(event)">
      <div class="field" id="campoNome" style="display:none;">
        <label for="nome">Seu nome</label>
        <input type="text" id="nome">
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" required>
      </div>

      <p class="auth-error" id="authError"></p>

      <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">Entrar</button>
    </form>
  </div>
</div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
